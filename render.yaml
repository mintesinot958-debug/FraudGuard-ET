services:
  - type: web
    name: fraudguard-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: fraudguard-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: UPLOADS_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: fraudguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false

databases:
  - name: fraudguard-db
    databaseName: fraudguard
    user: fraudguard
    plan: basic-256mb
